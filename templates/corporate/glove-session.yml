# A glove session: work with corporate resources only, over this machine's
# corporate VPN — no general internet. Edit this file, then
# `glove check && glove up`. Schema: README "Session file".
glove: 3
template: corporate
harness: pi
# enforcer: nono+srt           # default: nono+srt on docker, nono on podman | nono | srt | none
runtime: docker                # docker | podman
# Corporate repos the agent may read (never mount a credentials dir):
mounts: []                     # e.g. [{path: ~/src/corp-repo, mode: ro}]; work/ is always /work
extensions:
  llm:                         # the model (required): see extensions/llm/README.md
    provider: <set-me>         # openai-compatible | llama.cpp | ollama | lmstudio | openai | anthropic | …
    location: <set-me>         # host | lan | internet
    endpoint: <set-me>         # host:port for host/lan
    model: auto
    # api_key: keychain:<set-me>
  corporate:                   # the only way out: see extensions/corporate/README.md
    allow_domains: [<set-me>]  # host globs, e.g. ["*.corp.example", "git.example.internal"]
    allow_cidrs: []            # e.g. ["10.20.0.0/16"]
    # from_interface: <set-me> # also allow the host's routes via this interface (e.g. utun4; macOS)
    dns: host                  # host (follows the VPN's split DNS) | <IPv4 of a corporate DNS server>
    # tcp: [{name: git-ssh, to: "git.example.internal:22"}]   # raw TCP, as glove-<id>-git-ssh:22
    # probe_url: <set-me>      # an allowed URL `glove up` checks before starting the agent
  webfetch: {}                 # Pi's web_fetch, through the corporate gate
  observe: {}                  # record every flow (and transcripts) for review
  # filter: {}                 # let `glove filter …` / Layman block destinations too
  #
  # Credentialed tools (each secret a Keychain reference, never a value; every
  # host below must also be in corporate.allow_domains, a GitHub host with
  # "*.<host>", and a private address in allow_cidrs). Uncomment what you use;
  # README "Credentials" has the order and what `glove check` checks.
  #
  # A Claude Code plugin cloned into skills/ (never mounted), its API scripts
  # relayed with a token, read-only subcommands only:
  # skills:
  #   plugins:
  #     <set-me>:                                  # your name for it ([a-z0-9-])
  #       path: skills/<set-me>                    # the dir with .claude-plugin/plugin.json
  #       # skills: [<set-me>]                     # default: all of them
  #       relay:
  #         commands:
  #           scripts/<set-me>.py:
  #             hosts: [<set-me>]                  # e.g. wiki.corp.example
  #             allow: [<set-me>]                  # e.g. [search, fetch]: no posting subcommand
  #             out_flags: [-o, --output]          # a value must be a path under /work
  #             env: { <SET_ME>_TOKEN: keychain:<set-me> }   # or {secret: …, refresh: local/<hook>.sh}
  #         check: ["scripts/<set-me>.py <set-me>"]          # at `glove up`, and `glove skills status`
  #
  # gh and git against GitHub Enterprise hosts, a token each, no push:
  # github:
  #   hosts: [{host: <set-me>, token: "keychain:<set-me>"}]  # e.g. git.corp.example
  #   git: [fetch, clone, ls-remote]
  #
  # A browser signed in on this machine (`glove playwright login`), its session
  # handed to the sidecar; `capture` stores single values a relay's env names:
  # playwright:
  #   profile: ephemeral                         # required with storage_state
  #   storage_state: keychain:<set-me>
  #   login:
  #     start_url: https://<set-me>/             # a page behind your single sign-on
  #     domains: [<set-me>, "*.<set-me>"]        # whose cookies and localStorage are kept
  #     # capture: { <set-me>: {cookie: {domain: <set-me>, name: <set-me>}} }
brief: |
  # corporate — session brief

  You work with this organisation's internal resources. Read the repositories
  under `/work` and `/mnt`, and fetch internal pages with `web_fetch`. Put your
  outputs in `/work`.
