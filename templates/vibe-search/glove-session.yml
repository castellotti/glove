# A glove session: private web research with Mistral Vibe. Edit this file, then
# `glove check && glove up`. Schema: README "Session file".
glove: 3
template: vibe-search
harness: vibe
# enforcer: nono+srt           # default: nono+srt on docker, nono on podman | nono | srt | none
runtime: docker                # docker | podman
mounts: []                     # extra host dirs, e.g. [{path: ~/papers, mode: ro}]; work/ is always /work
apt_packages: [p7zip-full]     # `7z`, for archives fetched during research
limits: { pids: 512, memory: 6g, cpus: 4 }
extensions:
  llm:                         # the model (required): see extensions/llm/README.md
    provider: <set-me>         # openai-compatible | llama.cpp | ollama | lmstudio | openai | mistral | openrouter (Vibe speaks OpenAI-style APIs)
    location: <set-me>         # host | lan | internet   (where the server is, relative to this machine)
    endpoint: <set-me>         # host:port for host/lan; omit for a cloud provider's default
    model: auto                # auto → the single model the server lists, or an explicit id
    capabilities: auto         # auto (probe) | {vision: true, context_window: 32768}
    # api_key: keychain:<set-me>   # store it with `glove keychain set <service>`
  # Egress: exactly one of vpn | tor | direct. See extensions/vpn/README.md.
  vpn:
    provider: <set-me>         # a gluetun provider name, or `custom`
    wireguard_key: keychain:<set-me>
    # addresses: 10.0.0.2/32   # when your provider needs WIREGUARD_ADDRESSES
    # countries: [Sweden]      # a named provider's server filter (not with `custom`)
    # Instead of wireguard_key, a hook in local/ can register a fresh key each launch:
    # register_hook: local/<your-hook>.sh
    # register_user: keychain:<set-me>
    # register_pass: keychain:<set-me>
    # location: <set-me>       # where the hook picks its server (it gets VPN_LOCATION), e.g. a region id
  # tor: {}                    # replace `vpn:` with this for Tor
  # direct: {}                 # or this: no tunnel, no anonymity
  search: {}                   # SearXNG behind the egress (extensions/search/README.md)
  webfetch: {downloads: work}  # Vibe's fetch_url, from a sidecar through the egress;
                               # web_download saves files to downloads/ (extensions/webfetch/README.md)
  ocr: {}                      # tesseract/ocrmypdf/poppler + glove-ocr, for scanned PDFs and images
  media: {}
  # playwright: {downloads: work}   # a real Chromium in a sidecar, via the egress; its downloads land in
                                    # browser-output/ (extensions/playwright/README.md)
  # Network observability (Layman reads it): flows + transcripts to ~/.glove/observe/<id>/.
  # observe: {}                # exit_identity: auto (default) records the exit the egress reports
  # filter: {}                 # also let `glove filter …` / Layman block destinations (needs observe)
harness_config:                # passed through to Vibe's config.toml
  include_commit_signature: false
  show_thinking_nodes: true
brief: |
  # vibe-search — session brief

  You are an assistant for **private web research and document analysis**,
  running in a locked `glove` sandbox.

  ## How to research

  1. `tools.mcp_searxng.web_search` (in `run_typescript`) to find candidate URLs.
  2. `tools.mcp_webfetch.fetch_url` the promising ones to read their content, then cite them.
  3. The search index and exit IP are shared and rate-limited: do not hammer
     them, and on a 429 back off instead of retrying.

  Put your outputs in `/work`. Input files (e.g. PDFs to analyse) are placed
  there for you.

  ## Working with files

  `7z l`/`7z x` for archives: extract into a new folder under `/work`
  (`7z x /work/downloads/a.7z -o/work/a`), never over existing files.

  ## Research tips

  - Wayback CDX lists every archived file of a site:
    `https://web.archive.org/cdx/search/cdx?url=<site>&matchType=domain&output=json&fl=timestamp,original,mimetype&collapse=urlkey`
    (filters: `&filter=mimetype:application/pdf`, `&filter=original:.*name.*`).
    Read a capture with `tools.mcp_webfetch.fetch_url` at
    `https://web.archive.org/web/<timestamp>/<url>`.
  - archive.org's APIs find items and their files:
    `https://archive.org/advancedsearch.php?q=<terms>&fl[]=identifier&output=json`,
    then `https://archive.org/metadata/<identifier>`; a file is at
    `https://archive.org/download/<identifier>/<file>`.
  - Reddit blocks datacenter egress; use
    `https://api.pullpush.io/reddit/search/submission/?ids=<id>` (or `?q=`).
  - With `browser_*` tools: try a JS- or Cloudflare-walled page's Wayback capture;
    when a screenshot comes out blank, `browser_snapshot` usually still has
    the text; in the PDF viewer, jump with a `#page=N` URL fragment.
