api: 1
name: pi
summary: Pi coding agent (earendil-works/pi-coding-agent).
# 0.5.0: minimal base — harness + ring-1 enforcer (baked nono binary, glove-pty,
# enforcer extension) only. Optional capabilities are opt-in extensions.
image: glove/pi:0.5.0
# The harness release the image installs (the Dockerfile's HARNESS_VERSION).
version: 1.1.0
# The release protected_home, trusted_files and masked_files were audited
# against: a new release can add a dir it loads code or config from, so glove
# refuses a `version` that has not been re-audited.
audited_version: 1.1.0
# Load only the always-on ring-1 `enforcer` extension (deps are node builtins)
# from a system path; the user's own extensions still load from the config home.
# Capability extensions (search, browser) are added to this entry by the adapter
# when an extension contributes `harness: {pi: {extensions: …}}`.
# Pi runs on the image's node by path, not via its `#!/usr/bin/env node`
# shebang: a `toolchains` node block puts a pinned node first on PATH.
entry: [/usr/local/bin/node, /usr/local/bin/pi, -e, /opt/glove/pi-extensions/enforcer]
config_home: { env: PI_CODING_AGENT_DIR, path: /home/agent/.pi/agent }
# What the agent is told about this harness under glove (its context file).
brief: brief.md
# AGENTS.override.md, not AGENTS.md: Pi 1.x lets an override in the agent dir
# replace AGENTS.md/CLAUDE.md there (even an empty one), so glove's brief takes
# that name and is read-only (below).
context_file: /home/agent/.pi/agent/AGENTS.override.md
# Read-only to the agent (ring 0), relative to the home: the settings, models,
# trust store and brief glove renders; the files Pi 1.x loads prompts, MCP
# servers and keybindings from (an empty one is ignored: created at launch);
# and the dirs Pi loads code, skills, prompts and themes from (`bin/` also
# comes first on a tool command's PATH). The rendered `defaultProjectTrust:
# never` and empty trust store keep the project's `.pi/` (its `mcp.json`
# included) and `.agents/skills` from loading. Pi writes auth.json,
# models-store.json and sessions/ itself.
protected_home:
  - .pi/agent/settings.json
  - .pi/agent/models.json
  - .pi/agent/trust.json
  - .pi/agent/AGENTS.override.md
  - .pi/agent/SYSTEM.md
  - .pi/agent/APPEND_SYSTEM.md
  - .pi/agent/mcp.json
  - .pi/agent/keybindings.json
  - .pi/agent/extensions/
  - .pi/agent/skills/
  - .pi/agent/prompts/
  - .pi/agent/themes/
  - .pi/agent/bin/
  - .pi/agent/npm/
  - .pi/agent/git/
  - .agents/
# PI_OFFLINE stops Pi's startup egress attempts (fd download, version check,
# telemetry) that fail in the no-egress sandbox.
env: { PI_CODING_AGENT_DIR: /home/agent/.pi/agent, PI_OFFLINE: "1" }
sessions_subdir: sessions
transcript_subdir: sessions
# Pi and its pinned dependency tree live in /opt/pi (linked from /usr/local/bin).
runtime_paths: [/usr/local, /opt/pi]
# Debian bookworm's python3 (3.11): pip needs --break-system-packages (PEP 668)
pip: { install: [pip3, install, --no-cache-dir, --break-system-packages], bootstrap: [python3, python3-pip] }
# `pi --continue` reopens the last session; `--session <id>` accepts a path or partial UUID.
resume: { continue: [--continue], session: [--session, "{id}"] }
# Neutral extension contributions this harness renders (see extensions/README).
contributions: [skills]
# The tool inventory (measured on the audited version, codemode on): the enforcer
# extension wraps `shell`, holds `file_write` to the write roots, passes `allow`
# and refuses any other tool, an extension's or a renamed one (fail closed).
# Extensions add their own tools (`pi: {tools: …}`); codemode's nested calls are
# classified one by one. grep, find and ls are built in, off by default.
tools:
  shell: [bash]
  file_write: [write, edit]
  allow: [read, grep, find, ls, codemode]
