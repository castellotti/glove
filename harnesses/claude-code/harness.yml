api: 1
name: claude-code
summary: Anthropic's Claude Code CLI (native binary), signed in with an API key or a subscription token.
# 0.2.0: native binary + ring-1 enforcer (nono, glove-pty, glove-cc-prefix) only.
image: glove/claude-code:0.2.0
# The harness release the image installs (the Dockerfile's HARNESS_VERSION).
version: 2.1.292
# The release protected_home, trusted_files and masked_files were audited
# against: a new release can add a dir it loads code or config from, so glove
# refuses a `version` that has not been re-audited.
audited_version: 2.1.292
# By path: a `toolchains` block may put other binaries first on PATH.
entry: [/usr/local/bin/claude]
config_home: { env: CLAUDE_CONFIG_DIR, path: /home/agent/.claude }
# CC reads $CLAUDE_CONFIG_DIR/CLAUDE.md as the user's memory file.
context_file: /home/agent/.claude/CLAUDE.md
# The same switches are in the managed settings; here too so they hold before
# Claude Code has read them.
env: { CLAUDE_CONFIG_DIR: /home/agent/.claude, DISABLE_AUTOUPDATER: "1", CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1" }
# CC writes projects/<cwd slug>/<session uuid>.jsonl (+ <uuid>/subagents/*.jsonl).
sessions_subdir: projects
transcript_subdir: projects
# /etc/claude-code: glove's managed settings (read-only bind, see adapter.py).
runtime_paths: [/usr/local, /etc/claude-code]
# Debian bookworm's python3 (3.11): pip needs --break-system-packages (PEP 668)
pip: { install: [pip3, install, --no-cache-dir, --break-system-packages], bootstrap: [python3, python3-pip] }
resume: { continue: [--continue], session: [--resume, "{id}"] }
contributions: [mcp, skills]
# Project settings apply their `env` (LD_PRELOAD, BASH_ENV, exported functions)
# and commands to processes Claude Code starts itself, outside ring 1: ring 0
# binds them read-only, so only what the operator brought in is loaded.
trusted_files: [.claude/settings.json, .claude/settings.local.json]
# Read-only to the agent (ring 0), relative to the home: the settings and
# memory file glove renders, and the dirs Claude Code loads agents, commands,
# skills, plugins, output styles and rules from. It writes .claude.json,
# backups/, history.jsonl, projects/, sessions/ (and more over time): those
# stay writable. The managed settings also deny Read/Edit of the whole home.
protected_home:
  - .claude/settings.json
  - .claude/CLAUDE.md
  - .claude/agents/
  - .claude/commands/
  - .claude/skills/
  - .claude/plugins/
  - .claude/output-styles/
  - .claude/rules/
# The tool inventory (measured on 2.1.292): the managed settings pre-approve
# `shell` (run under the shell prefix), `file_write` (denied outside the write
# roots) and `allow`; `ask` is left to Claude Code's prompt, as it ships;
# `deny` is denied. EnterWorktree runs git from the harness process, outside
# ring 1, and cannot work under ring 0's read-only .git anyway. WebFetch reaches
# only the session's forwarders: denied unless webfetch hands it the egress
# proxy (then approved). A tool a new release adds
# prompts; the live test (cc_live) checks the list at upgrade time.
tools:
  shell: [Bash]
  file_write: [Edit, Write, NotebookEdit]
  allow: [Read, Agent, WebSearch]
  ask: [Workflow, Skill, CronCreate, CronDelete, CronList, ScheduleWakeup, ListAgents, SendMessage,
        TaskStop, ReportFindings]
  deny: [EnterWorktree, ExitWorktree, WebFetch]
