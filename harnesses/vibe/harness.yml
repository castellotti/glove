api: 1
name: vibe
summary: Mistral Vibe.
# 0.5.0: minimal base — harness + ring-1 enforcer (baked nono binary, glove-pty,
# pre_tool hook) only. Optional capabilities are opt-in extensions.
image: glove/vibe:0.5.0
# The harness release the image installs (the Dockerfile's HARNESS_VERSION).
version: 2.26.0
# The release protected_home, trusted_files and masked_files were audited
# against: a new release can add a dir it loads code or config from, so glove
# refuses a `version` that has not been re-audited.
audited_version: 2.26.0
# `--trust` trusts /work for this run (no trust dialog; the project's AGENTS.md
# loads): what else Vibe would load from the project is masked below.
entry: [vibe, --trust, --yolo, --workdir, /work]
config_home: { env: VIBE_HOME, path: /home/agent/.vibe }
# What the agent is told about this harness under glove (its context file).
brief: brief.md
context_file: /home/agent/.vibe/AGENTS.md
# Read-only to the agent (ring 0), relative to the home: the config and hooks
# glove renders (its pre_tool hook wraps every command), `.env` (VIBE_*
# settings), and the dirs Vibe loads tools, plugins, agents, prompts and
# skills from.
protected_home:
  - .vibe/config.toml
  - .vibe/hooks.toml
  - .vibe/.env
  - .vibe/tools/
  - .vibe/plugins/
  - .vibe/agents/
  - .vibe/prompts/
  - .vibe/skills/
  - .agents/
env: { VIBE_HOME: /home/agent/.vibe }
# Vibe 2.x writes each session to logs/session/session_<ts>_<id>/messages.jsonl
# (and never creates sessions/).
sessions_subdir: logs/session
transcript_subdir: logs/session
# vibe is installed with `uv tool install` under /opt/uv; its shebang points at
# that venv's python (→ /usr/local's cpython).
runtime_paths: [/opt/uv, /usr/local]
# Python packages install system-wide via the baked uv.
pip: { install: [uv, pip, install, --system] }
# `-c`/`--continue` continues the most recent session (non-interactive); bare
# `--resume` opens an interactive picker (and errors in programmatic mode), so
# continue-last must map to --continue, not --resume. A specific id is `--resume <id>`.
resume: { continue: [--continue], session: [--resume, "{id}"] }
contributions: [mcp]
# The project's own config (a trusted /work): hooks there run before glove's
# and shadow a hook of the same name, and its config, tools and plugins load
# into Vibe. Masked: an empty read-only directory, whatever the repo holds.
masked_files: [.vibe/, .agents/]
# The tool inventory, by the names the pre_tool hook sees (measured on 2.26.0:
# grouped, `file_system.bash`; the top-level names Vibe also offers): the hook
# wraps `shell`, holds `file_write` to the write roots, passes `allow` and
# refuses any other tool (fail closed). run_typescript, search_tool_functions
# and skill never reach the hook, only the calls they make. glove's MCP servers
# add `mcp_<server>.<tool>` for each tool their allowlist names. Vibe 2.26 has
# no native web tool; older ones are denied (no direct egress).
tools:
  shell: [bash, file_system.bash, process.start]
  file_write: [write_file, edit, search_replace, file_system.write_file, file_system.edit,
               file_system.search_replace]
  allow: [read_file, todo, cron, file_system.read_file, process.list, process.output, process.stop,
          process.write, self.sleep, vibe.todo, vibe.cron, vibe.unified_harness_scratchpad]
  deny: [web_fetch, web_search]
