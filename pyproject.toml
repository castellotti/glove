[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glove"
version = "0.2.0"
description = "Sandboxed environments for agentic harnesses (Docker/Podman session manager)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Steve Castellotti", email = "sc@jigsaw.studio" }]
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16"]

[project.scripts]
glove = "glove.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["glove"]
artifacts = [
    "glove/templates/*",
    "glove/harnesses/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# The codebase wraps prose at ~88 but runs functional lines longer; 120 is a
# real ceiling that matches practice without a wholesale reflow.
line-length = 120
# Integration scripts are bash; the harness images vendor third-party code.
extend-exclude = ["tests/integration", "glove/harnesses"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# B008: Typer's API *requires* `= typer.Option(...)` / `typer.Argument(...)` in
# defaults — the whole CLI relies on it, so it is not a smell here.
ignore = ["B008"]
