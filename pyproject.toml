[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glove"
version = "0.2.0"
description = "Sandboxed environments for agentic harnesses (Docker/Podman session manager)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Steve Castellotti", email = "sc@jigsaw.studio" }]
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
glove = "glove.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["glove"]
artifacts = [
    "glove/templates/*",
    "glove/harnesses/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
