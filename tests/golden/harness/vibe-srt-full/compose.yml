# Generated by glove — do not edit by hand.
# Session: s   Harness: vibe
name: glove-s

services:

  # --- harness: the sandboxed agent (internal net only, hardened) ------------
  glove-s-harness:
    container_name: glove-s-harness
    image: glove/vibe:0.5.0-b7906c6b97-srt-f5b44676c0
    working_dir: /work
    command: ["/opt/glove/bin/glove-pty", "relay", "--", "/opt/glove/srt/node", "/opt/glove/srt/glove-srt.mjs", "/etc/glove/enforcer/srt-harness.json", "--", "/opt/glove/bin/glove-pty", "ctty", "--", "vibe", "--trust", "--yolo", "--workdir", "/work"]
    stdin_open: true
    tty: true
    # --- hardening set (PLAN §3.2); `allow_root` only drops the non-root user --
    user: "501:20"
    ipc: private
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=<REPO>/glove/runtimes/seccomp/nested-userns.json"
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    environment:
      HOME: "/home/agent"
      VIBE_HOME: "/home/agent/.vibe"
      BROWSER_MCP_URL: "http://glove-s-browser:8931/mcp"
      BROWSER_MCP_TOOLS: "browser_navigate,browser_navigate_back,browser_snapshot,browser_take_screenshot,browser_click,browser_type,browser_hover,browser_select_option,browser_press_key,browser_wait_for,browser_tabs,browser_handle_dialog"
      BROWSER_MODE: "headless"
      GIT_CONFIG_PARAMETERS: "\u0027safe.directory\u0027=\u0027/work\u0027"
    volumes:
      - type: bind
        source: "<TMP>/home"
        target: /home/agent
      - type: bind
        source: "<TMP>/work"
        target: /work
      # ring 0: re-bound so it is a mount point and cannot be renamed away
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe"
        target: "/home/agent/.vibe"
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/config.toml"
        target: "/home/agent/.vibe/config.toml"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/hooks.toml"
        target: "/home/agent/.vibe/hooks.toml"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/.env"
        target: "/home/agent/.vibe/.env"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/tools"
        target: "/home/agent/.vibe/tools"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/plugins"
        target: "/home/agent/.vibe/plugins"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/agents"
        target: "/home/agent/.vibe/agents"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/prompts"
        target: "/home/agent/.vibe/prompts"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/skills"
        target: "/home/agent/.vibe/skills"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.agents"
        target: "/home/agent/.agents"
        read_only: true
      # observe export: the harness writes its transcripts straight into
      # ~/.glove/observe/<id>/transcripts (after the home bind, so it overlays it)
      - type: bind
        source: "<GLOVE_HOME>/observe/s/transcripts"
        target: "/home/agent/.vibe/logs/session"
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under /home/agent overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777
    networks:
      - glove-s-net

