# Generated by glove — do not edit by hand.
# Session: s   Harness: claude-code
name: glove-s

services:

  # --- harness: the sandboxed agent (internal net only, hardened) ------------
  glove-s-harness:
    container_name: glove-s-harness
    image: glove/claude-code:0.2.0-dee1521c33
    working_dir: /work
    command: ["nono", "run", "-s", "--allow-cwd", "--profile", "/etc/glove/enforcer/harness.json", "--", "/usr/local/bin/claude"]
    stdin_open: true
    tty: true
    # --- hardening set (PLAN §3.2); `allow_root` only drops the non-root user --
    user: "501:20"
    ipc: private
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=<REPO>/glove/runtimes/seccomp/default.json"
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    environment:
      HOME: "/home/agent"
      CLAUDE_CONFIG_DIR: "/home/agent/.claude"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      GIT_CONFIG_PARAMETERS: "\u0027safe.directory\u0027=\u0027/work\u0027"
      NODE_EXTRA_CA_CERTS: "/run/glove/llm-ca/ca.pem"
      CLAUDE_CODE_OAUTH_TOKEN: "glove-injected"
      NONO_NO_PROXY: "localhost,127.0.0.1"
    volumes:
      - type: bind
        source: "<TMP>/home"
        target: /home/agent
      - type: bind
        source: "<TMP>/work"
        target: /work
      # ring 0: re-bound so it is a mount point and cannot be renamed away
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/work/.claude"
        target: "/work/.claude"
      # ring 0: re-bound so it is a mount point and cannot be renamed away
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude"
        target: "/home/agent/.claude"
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/settings.json"
        target: "/home/agent/.claude/settings.json"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/CLAUDE.md"
        target: "/home/agent/.claude/CLAUDE.md"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/agents"
        target: "/home/agent/.claude/agents"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/commands"
        target: "/home/agent/.claude/commands"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/skills"
        target: "/home/agent/.claude/skills"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/plugins"
        target: "/home/agent/.claude/plugins"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/output-styles"
        target: "/home/agent/.claude/output-styles"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/rules"
        target: "/home/agent/.claude/rules"
        read_only: true
      # channel llm-ca (llm): a directory shared with its
      # sidecar(s) llm-auth (session tmpfs; no network)
      - type: volume
        source: glove-s-chan-llm-ca
        target: /run/glove/llm-ca
        read_only: true  # its sidecar(s) write it; the harness only reads
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.nono
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.local/state/nono
        tmpfs:
          mode: 01777
    networks:
      - glove-s-net

  # --- forwarder: llm -> glove-s-llm-auth:8080
  glove-s-llm:
    container_name: glove-s-llm
    image: glove/forwarder:0.2.0-cdcce0aed5
    command: "TCP4-LISTEN:443,fork,reuseaddr TCP4:glove-s-llm-auth:8080"
    restart: unless-stopped
    # sidecar hardening (every forwarder): non-root, no caps, no privilege gain,
    # read-only rootfs, pids/memory limits. Never NET_ADMIN, never the harness's
    # network/PID namespace, never its home. No host binds, so never keep-id:
    # its uid stays an unprivileged subuid on rootless podman.
    user: "501:20"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    pids_limit: 64
    mem_limit: 256m

    # a low port as non-root: podman does not default this (docker does);
    # namespaced to this forwarder's own network namespace
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      glove-s-net:
        aliases:
          - api.anthropic.com
      glove-s-llmauth: {}

  # --- forwarder: llm-upstream -> api.anthropic.com:443
  glove-s-llm-upstream:
    container_name: glove-s-llm-upstream
    image: glove/forwarder:0.2.0-cdcce0aed5
    command: "TCP4-LISTEN:443,fork,reuseaddr TCP4:api.anthropic.com:443"
    restart: unless-stopped
    # sidecar hardening (every forwarder): non-root, no caps, no privilege gain,
    # read-only rootfs, pids/memory limits. Never NET_ADMIN, never the harness's
    # network/PID namespace, never its home. No host binds, so never keep-id:
    # its uid stays an unprivileged subuid on rootless podman.
    user: "501:20"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    pids_limit: 64
    mem_limit: 256m

    # a low port as non-root: podman does not default this (docker does);
    # namespaced to this forwarder's own network namespace
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      glove-s-llm: {}
      glove-s-llmauth: {}

  # --- extension sidecars (validated + hardened by glove/compose.py) ---------
  glove-s-llm-auth:
    container_name: glove-s-llm-auth
    image: glove/ext-llm-auth:f339aaed58
    environment:
      LLM_AUTH_KEY: null
      LLM_AUTH_UPSTREAM: glove-s-llm-upstream:443
      LLM_AUTH_TLS_NAME: api.anthropic.com
      LLM_AUTH_HOST: api.anthropic.com
      LLM_AUTH_HEADER: Authorization
      LLM_AUTH_SCHEME: Bearer
      LLM_AUTH_ALLOW: '[["POST", "/v1/messages"], ["POST", "/v1/messages/count_tokens"],
        ["HEAD", "/api/hello"], ["GET", "/api/claude_code/settings"], ["GET", "/api/claude_code/policy_limits"],
        ["GET", "/api/oauth/profile"], ["GET", "/api/oauth/usage"], ["GET", "/api/web/domain_info"],
        ["GET", "/v1/models"]]'
      LLM_AUTH_PORT: '8080'
      LLM_AUTH_SERVE_TLS: '1'
      LLM_AUTH_CA_DIR: /run/glove/llm-ca
    tmpfs:
    - /tmp
    restart: 'no'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import socket, ssl; ssl.create_default_context(cafile='/run/glove/llm-ca/ca.pem').wrap_socket(socket.create_connection(('127.0.0.1',
        8080), 2), server_hostname='api.anthropic.com').close()
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    networks:
      glove-s-llmauth: {}
    volumes:
    - type: volume
      source: glove-s-chan-llm-ca
      target: /run/glove/llm-ca
    user: '501:20'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - seccomp=<REPO>/glove/runtimes/seccomp/default.json
    read_only: true
    ipc: private
    pids_limit: 256
    mem_limit: 512m

networks:
  glove-s-net:
    name: glove-s-net
    internal: true
  glove-s-llmauth:
    name: glove-s-llmauth
    internal: true
  glove-s-llm:
    name: glove-s-llm

volumes:
  glove-s-chan-llm-ca:
    name: glove-s-chan-llm-ca
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0700,uid=501,gid=20
