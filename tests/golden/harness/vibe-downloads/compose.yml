# Generated by glove — do not edit by hand.
# Session: s   Harness: vibe
name: glove-s

services:

  # --- harness: the sandboxed agent (internal net only, hardened) ------------
  glove-s-harness:
    container_name: glove-s-harness
    image: glove/vibe:0.5.0-fbc2201932-srt-46f57ff955
    working_dir: /work
    command: ["/opt/glove/bin/glove-pty", "relay", "--", "/opt/glove/srt/node", "/opt/glove/srt/glove-srt.mjs", "/etc/glove/enforcer/srt-harness.json", "--", "/opt/glove/bin/glove-pty", "ctty", "--", "vibe", "--trust", "--yolo", "--workdir", "/work"]
    stdin_open: true
    tty: true
    # --- hardening set (PLAN §3.2); `allow_root` only drops the non-root user --
    user: "501:20"
    ipc: private
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=<REPO>/glove/runtimes/seccomp/nested-userns.json"
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    environment:
      HOME: "/home/agent"
      VIBE_HOME: "/home/agent/.vibe"
      GIT_CONFIG_PARAMETERS: "\u0027safe.directory\u0027=\u0027/work\u0027"
    volumes:
      # the harness home, read-only: its config home is re-bound read-write below
      - type: bind
        source: "<TMP>/home"
        target: /home/agent
        read_only: true
      - type: bind
        source: "<TMP>/work"
        target: /work
      - type: bind
        source: "<TMP>/downloads"
        target: /work/downloads
        read_only: true
      # ring 0: re-bound read-write: a mount point, so it cannot be renamed away
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe"
        target: "/home/agent/.vibe"
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/config.toml"
        target: "/home/agent/.vibe/config.toml"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/hooks.toml"
        target: "/home/agent/.vibe/hooks.toml"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/.env"
        target: "/home/agent/.vibe/.env"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/tools"
        target: "/home/agent/.vibe/tools"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/plugins"
        target: "/home/agent/.vibe/plugins"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/agents"
        target: "/home/agent/.vibe/agents"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/prompts"
        target: "/home/agent/.vibe/prompts"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.vibe/skills"
        target: "/home/agent/.vibe/skills"
        read_only: true
      # observe export: the harness writes its transcripts straight into
      # ~/.glove/observe/<id>/transcripts (after the home bind, so it overlays it)
      - type: bind
        source: "<GLOVE_HOME>/observe/s/transcripts"
        target: "/home/agent/.vibe/logs/session"
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.nono
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.local/state/nono
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.config/nono
        tmpfs:
          mode: 01777
    networks:
      - glove-s-net

  # --- extension sidecars (validated + hardened by glove/compose.py) ---------
  glove-s-direct-proxy:
    container_name: glove-s-direct-proxy
    image: glove/ext-direct-proxy:111d32dafc
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - 127.0.0.1
      - '8888'
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      glove-s-egress: {}
      glove-s-wan: {}
    restart: unless-stopped
    user: '501:20'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - seccomp=<REPO>/glove/runtimes/seccomp/default.json
    read_only: true
    ipc: private
    pids_limit: 256
    mem_limit: 512m
  glove-s-netgate:
    container_name: glove-s-netgate
    image: glove/ext-gate-netgate:87fb623dc0
    command:
    - collect
    - --net-dir
    - /var/lib/glove/net
    - --events
    - /run/glove-netgate/events.sock
    network_mode: none
    volumes:
    - type: bind
      source: <GLOVE_HOME>/observe/s/net
      target: /var/lib/glove/net
    - type: volume
      source: glove-s-observe-events
      target: /run/glove-netgate
    restart: unless-stopped
    user: '501:20'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - seccomp=<REPO>/glove/runtimes/seccomp/default.json
    read_only: true
    ipc: private
    pids_limit: 256
    mem_limit: 512m
  glove-s-fetcher:
    container_name: glove-s-fetcher
    image: glove/ext-webfetch-mcp:e2f07d880e
    environment:
      GLOVE_FETCH_PROXY: http://glove-s-webfetch-egress:8888
      GLOVE_FETCH_ALLOW: ''
      MCP_ALLOWED_HOST: glove-s-webfetch-mcp:8000,glove-s-webdownload-mcp:8000
      GLOVE_DOWNLOAD_PROXY: http://glove-s-webdownload-egress:8888
      GLOVE_DOWNLOADS: /run/glove-output/downloads
      GLOVE_DOWNLOADS_SHOWN_AS: /work/downloads
      GLOVE_MIN_FREE: 2g
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import socket; socket.create_connection(('127.0.0.1', 8000), 2)
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      glove-s-fetchnet: {}
    volumes:
    - type: bind
      source: <TMP>/downloads
      target: /run/glove-output/downloads
    restart: unless-stopped
    user: '501:20'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - seccomp=<REPO>/glove/runtimes/seccomp/default.json
    read_only: true
    ipc: private
    pids_limit: 256
    mem_limit: 512m
  glove-s-llm:
    container_name: glove-s-llm
    image: glove/ext-gate-netgate:87fb623dc0
    command:
    - forward
    - --service
    - llm
    - --mode
    - tcp
    - --listen
    - '8080'
    - --upstream
    - tcp:host.docker.internal:8080
    - --route
    - tcp
    - --env
    - s
    - --session
    - s
    - --resolve
    - in-tunnel
    - --events
    - /run/glove-netgate/events.sock
    - --client
    - unknown
    - --record
    - metadata
    - --ingress-alias
    - glove-s-llm-ingress
    - --scope
    - local
    - --tool
    - llm
    networks:
      glove-s-net:
        aliases:
        - glove-s-llm-ingress
      glove-s-hostgw: {}
    volumes:
    - type: volume
      source: glove-s-observe-events
      target: /run/glove-netgate
    depends_on:
      glove-s-netgate:
        condition: service_started
    restart: unless-stopped
    user: '501:20'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - seccomp=<REPO>/glove/runtimes/seccomp/default.json
    read_only: true
    ipc: private
    pids_limit: 256
    mem_limit: 512m
