# Generated by glove — do not edit by hand.
# Session: s   Harness: claude-code
name: glove-s

services:

  # --- harness: the sandboxed agent (internal net only, hardened) ------------
  glove-s-harness:
    container_name: glove-s-harness
    image: glove/claude-code:0.2.0-91e42d0a0c-srt-46f57ff955
    working_dir: /work
    command: ["/opt/glove/bin/glove-pty", "relay", "--", "/opt/glove/srt/node", "/opt/glove/srt/glove-srt.mjs", "/etc/glove/enforcer/srt-harness.json", "--", "/opt/glove/bin/glove-pty", "ctty", "--", "/usr/local/bin/claude"]
    stdin_open: true
    tty: true
    # --- hardening set (PLAN §3.2); `allow_root` only drops the non-root user --
    user: "501:20"
    ipc: private
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=<REPO>/glove/runtimes/seccomp/nested-userns.json"
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    environment:
      HOME: "/home/agent"
      CLAUDE_CONFIG_DIR: "/home/agent/.claude"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      GIT_CONFIG_PARAMETERS: "\u0027safe.directory\u0027=\u0027/work\u0027"
      NODE_EXTRA_CA_CERTS: "/run/glove/llm-ca/ca.pem"
      CLAUDE_CODE_OAUTH_TOKEN: "glove-injected"
    volumes:
      # the harness home, read-only: its config home is re-bound read-write below
      - type: bind
        source: "<TMP>/home"
        target: /home/agent
        read_only: true
      - type: bind
        source: "<TMP>/work"
        target: /work
      - type: bind
        source: "<TMP>/downloads"
        target: /work/downloads
        read_only: true
      # ring 0: re-bound read-write: a mount point, so it cannot be renamed away
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/work/.claude"
        target: "/work/.claude"
      # ring 0: re-bound read-write: a mount point, so it cannot be renamed away
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude"
        target: "/home/agent/.claude"
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/settings.json"
        target: "/home/agent/.claude/settings.json"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/CLAUDE.md"
        target: "/home/agent/.claude/CLAUDE.md"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/agents"
        target: "/home/agent/.claude/agents"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/commands"
        target: "/home/agent/.claude/commands"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/skills"
        target: "/home/agent/.claude/skills"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/plugins"
        target: "/home/agent/.claude/plugins"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/output-styles"
        target: "/home/agent/.claude/output-styles"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/rules"
        target: "/home/agent/.claude/rules"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the bind it sits in, so it overlays it)
      - type: bind
        source: "<TMP>/home/.claude/dev-mods"
        target: "/home/agent/.claude/dev-mods"
        read_only: true
      # observe export: the harness writes its transcripts straight into
      # ~/.glove/observe/<id>/transcripts (after the home bind, so it overlays it)
      - type: bind
        source: "<GLOVE_HOME>/observe/s/transcripts"
        target: "/home/agent/.claude/projects"
      # channel llm-ca (llm): a directory shared with its
      # sidecar(s) llm-auth (session tmpfs; no network)
      - type: volume
        source: glove-s-chan-llm-ca
        target: /run/glove/llm-ca
        read_only: true  # its sidecar(s) write it; the harness only reads
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.nono
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.local/state/nono
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under the home overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.config/nono
        tmpfs:
          mode: 01777
    networks:
      - glove-s-net

