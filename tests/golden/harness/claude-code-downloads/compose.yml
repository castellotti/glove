      LLM_AUTH_HOST: api.anthropic.com
      LLM_AUTH_HEADER: Authorization
      LLM_AUTH_SCHEME: Bearer
      LLM_AUTH_ALLOW: '[["POST", "/v1/messages"], ["POST", "/v1/messages/count_tokens"],
        ["HEAD", "/api/hello"], ["GET", "/api/claude_code/settings"], ["GET", "/api/claude_code/policy_limits"],
        ["GET", "/api/oauth/profile"], ["GET", "/api/oauth/usage"], ["GET", "/api/web/domain_info"],
        ["GET", "/v1/models"]]'
      LLM_AUTH_PORT: '8080'
      LLM_AUTH_SERVE_TLS: '1'
      LLM_AUTH_CA_DIR: /run/glove/llm-ca
    tmpfs:
    - /tmp
    restart: 'no'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import socket, ssl; ssl.create_default_context(cafile='/run/glove/llm-ca/ca.pem').wrap_socket(socket.create_connection(('127.0.0.1',
        8080), 2), server_hostname='api.anthropic.com').close()
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    networks:
      glove-s-llmauth: {}
    volumes:
    - type: volume
      source: glove-s-chan-llm-ca
      target: /run/glove/llm-ca
    user: '501:20'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - seccomp=<REPO>/glove/runtimes/seccomp/default.json
    read_only: true
    ipc: private
    pids_limit: 256
