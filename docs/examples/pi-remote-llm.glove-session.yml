# Pi against a remote OpenAI-compatible LLM reached over an SSH tunnel, plus a
# headed Playwright browser on this Mac. See docs/pi-remote-llm.md.
# Start a session from it: glove new docs/examples/pi-remote-llm.glove-session.yml <dir>
#
# Open the tunnel yourself before `glove up` (glove starts no host processes for
# a session): `ssh -fN -L 127.0.0.1:8899:127.0.0.1:8080 <remote-host>` forwards
# 127.0.0.1:8899 on this Mac to the remote server, so to glove the model is at
# `location: host`. (If the server is directly reachable on your LAN, use
# `location: lan` and `endpoint: <host>:<port>` instead, and skip the tunnel.)
glove: 3
harness: pi
runtime: docker
enforcer: nono
harness_config:
  settings:
    defaultThinkingLevel: xhigh
extensions:
  llm:
    provider: openai-compatible
    location: host
    endpoint: 127.0.0.1:8899
    model: auto
    capabilities: auto
    # api_key: keychain:my-llm
  playwright:
    mode: host
