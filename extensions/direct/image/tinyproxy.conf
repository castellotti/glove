# Only egress consumers on the session's internal egress network can reach
# this listener; there is no Allow list to maintain.
# LogLevel Critical: the healthcheck's port probe would log an error every 10s.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Critical
DisableViaHeader Yes
# Never a way into this machine or its LAN: refuse local names, single-label
# names (other containers) and non-public IP literals. Judged by shape; a public
# name that resolves privately is not caught here (web_fetch guards the same
# shapes before the request is sent).
Filter "/etc/glove/tinyproxy.filter"
FilterExtended On
FilterDefaultDeny No
ConnectPort 443
ConnectPort 80
