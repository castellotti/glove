# Generated by glove — do not edit by hand.
# Session: s   Harness: pi
name: glove-s

services:

  # --- harness: the sandboxed agent (internal net only, hardened) ------------
  glove-s-harness:
    container_name: glove-s-harness
    image: glove/pi:0.5.0
    working_dir: /work
    command: ["nono", "run", "-s", "--allow-cwd", "--profile", "/etc/glove/enforcer/harness.json", "--", "/usr/local/bin/node", "/usr/local/bin/pi", "-e", "/opt/glove/pi-extensions/enforcer"]
    stdin_open: true
    tty: true
    # --- hardening set (PLAN §3.2); `allow_root` only drops the non-root user --
    user: "501:20"
    ipc: private
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=<seccomp>/default.json"
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    environment:
      HOME: "/home/agent"
      PI_CODING_AGENT_DIR: "/home/agent/.pi/agent"
      PI_OFFLINE: "1"
      GIT_CONFIG_PARAMETERS: "\u0027safe.directory\u0027=\u0027/work\u0027"
      NONO_NO_PROXY: "localhost,127.0.0.1"
      GLOVE_LLM_API_KEY: null  # from glove's environment at run time; never stored here
    volumes:
      - type: bind
        source: "<tmp>/home"
        target: /home/agent
      - type: bind
        source: "<tmp>/work"
        target: /work
      # ring 0: re-bound so it is a mount point and cannot be renamed away
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi"
        target: "/home/agent/.pi"
      # ring 0: re-bound so it is a mount point and cannot be renamed away
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent"
        target: "/home/agent/.pi/agent"
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/settings.json"
        target: "/home/agent/.pi/agent/settings.json"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/models.json"
        target: "/home/agent/.pi/agent/models.json"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/trust.json"
        target: "/home/agent/.pi/agent/trust.json"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/extensions"
        target: "/home/agent/.pi/agent/extensions"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/skills"
        target: "/home/agent/.pi/agent/skills"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/prompts"
        target: "/home/agent/.pi/agent/prompts"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/themes"
        target: "/home/agent/.pi/agent/themes"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/bin"
        target: "/home/agent/.pi/agent/bin"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/npm"
        target: "/home/agent/.pi/agent/npm"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.pi/agent/git"
        target: "/home/agent/.pi/agent/git"
        read_only: true
      # ring 0: read-only over a path the host or the harness later runs or trusts
      # (after the rw bind it sits in, so it overlays it)
      - type: bind
        source: "<tmp>/home/.agents"
        target: "/home/agent/.agents"
        read_only: true
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under /home/agent overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under /home/agent overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.nono
        tmpfs:
          mode: 01777
      # writable tmpfs (mode 01777, YAML octal → 1777) — listed after the binds so
      # a target nested under /home/agent overlays the bind. mode is forced
      # explicitly: over a mountpoint that already exists on the bind, a bare
      # tmpfs mounts 755 root:root and the non-root harness can't write it.
      # Enforcer state (e.g. nono's control socket, which the macOS/Windows bind
      # mount can't host) lives here; the agent's Landlock policy still denies it.
      - type: tmpfs
        target: /home/agent/.local/state/nono
        tmpfs:
          mode: 01777
    networks:
      - glove-s-net

  # --- forwarder: llm -> glove-s-llm-out:443
  glove-s-llm:
    container_name: glove-s-llm
    image: glove/forwarder:0.2.0
    command: "TCP4-LISTEN:443,fork,reuseaddr TCP4:glove-s-llm-out:443"
    restart: unless-stopped
    # sidecar hardening (every forwarder): non-root, no caps, no privilege gain,
    # read-only rootfs, pids/memory limits. Never NET_ADMIN, never the harness's
    # network/PID namespace, never its home. No host binds, so never keep-id:
    # its uid stays an unprivileged subuid on rootless podman.
    user: "501:20"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    pids_limit: 64
    mem_limit: 256m

    # a low port as non-root: podman does not default this (docker does);
    # namespaced to this forwarder's own network namespace
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      glove-s-net:
        aliases:
          - api.openai.com
      glove-s-llm: {}

  # --- forwarder: llm-out -> api.openai.com:443
  glove-s-llm-out:
    container_name: glove-s-llm-out
    image: glove/forwarder:0.2.0
    command: "TCP4-LISTEN:443,fork,reuseaddr TCP4:api.openai.com:443"
    restart: unless-stopped
    # sidecar hardening (every forwarder): non-root, no caps, no privilege gain,
    # read-only rootfs, pids/memory limits. Never NET_ADMIN, never the harness's
    # network/PID namespace, never its home. No host binds, so never keep-id:
    # its uid stays an unprivileged subuid on rootless podman.
    user: "501:20"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    pids_limit: 64
    mem_limit: 256m

    # a low port as non-root: podman does not default this (docker does);
    # namespaced to this forwarder's own network namespace
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      glove-s-llm: {}

networks:
  glove-s-net:
    name: glove-s-net
    internal: true
  glove-s-llm:
    name: glove-s-llm
