api: 1
name: llm
summary: The inference engine — pick a provider like a gluetun VPN provider; the harness reaches it only through one forwarder.
provides: [inference]
settings:
  provider:     { type: enum, required: true,
                  values: [openai-compatible, anthropic-compatible, llama.cpp, ollama, lmstudio, openai, anthropic, mistral, openrouter] }
  location:     { type: enum, values: [host, lan, internet] }       # where the server is, relative to this Mac
  endpoint:     { type: string }                                    # host:port (host/lan) or a URL (openai-compatible)
  model:        { type: string, default: auto }                     # an id, or `auto` (the single model /v1/models lists)
  api_key:      { type: secret }                                    # keychain:<service> | env:<VAR>
  auth:         { type: enum, values: [api-key, oauth], default: api-key }  # oauth: a subscription token, where the catalog allows it
  capabilities: { type: map, also: [auto], default: auto }          # auto, or explicit keys (probes fill the rest)
  extra_models: { type: list, default: [] }
  route:        { type: enum, values: [direct, egress], default: direct }   # cloud providers only
hooks: hooks.py
# With an API key (not a Claude Code subscription token), the key lives only in
# the llm-auth sidecar: the harness's `llm` forwarder leads to it, and it dials
# the server through `llm-upstream` (hooks.py builds both endpoints).
networks:
  llmauth: { internal: true, when: { api_key: { set: true }, auth: api-key } }
images:
  auth: { build: image, when: { api_key: { set: true }, auth: api-key } }
services: compose/services.yml.j2
verify:
  - { name: llm-auth-up, kind: container-healthy, service: llm-auth, when: { api_key: { set: true }, auth: api-key } }
harness:
  brief: brief.md
