name: anthropic
api: anthropic-messages
host: api.anthropic.com
base_path: ""
locations: [internet]
# `auth: oauth` takes a Claude subscription token (`claude setup-token`), which is
# for Claude Code only; it authenticates as a bearer token with the OAuth beta.
# `paths`: the account calls llm-auth lets through besides inference (GET only;
# measured, Claude Code 2.1.288: settings and policy limits at start, profile
# and usage for /status and /usage). Feedback, transcript sharing and account
# writes stay refused.
auth:
  header: x-api-key
  scheme: ""
  required: true
  oauth:
    header: Authorization
    scheme: Bearer
    headers: { anthropic-beta: oauth-2025-04-20 }
    harnesses: [claude-code]
    paths:
      - [GET, /api/claude_code/settings]
      - [GET, /api/claude_code/policy_limits]
      - [GET, /api/oauth/profile]
      - [GET, /api/oauth/usage]
headers: { anthropic-version: "2023-06-01" }
# paginated: ask for a large page and follow `has_more` with `after_id=<last_id>`
models_endpoint: /v1/models?limit=1000
models_cursor: after_id
# the list names dated snapshots (claude-haiku-4-5-20251001); the API also takes the alias
dated_aliases: true
defaults: { vision: true, context_window: 200000, max_tokens: 8192, reasoning: false }
