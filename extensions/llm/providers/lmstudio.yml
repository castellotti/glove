name: lmstudio
api: openai-completions
base_path: /v1
default_port: 1234
locations: [host, lan]
auth: { header: Authorization, scheme: Bearer, required: false }
models_endpoint: /v1/models
probes:
  capabilities:
    path: /api/v0/models/{model}
    vision: { path: "$.type", equals: vlm }
    context_window: "$.max_context_length"
defaults: { vision: false, context_window: 32768, max_tokens: 8192, reasoning: false }
