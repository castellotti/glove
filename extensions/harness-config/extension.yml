api: 2
name: harness-config
summary: The harness's own native config (Pi settings.json, Vibe config.toml, Claude Code settings.json), as written.
# Its settings are free-form: each is a key of the harness's native config, and
# the adapter renders it (core checks none of them). Model tuning goes in the
# `llm` extension's `harness` setting; both are merged.
harness:
  config: "*"
