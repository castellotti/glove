api: 1
name: webfetch
summary: Pi's web_fetch tool — read a URL as text through the egress provider's proxy (endpoint `proxy`).
requires: [egress]
validate:
  - when: { harness: vibe }
    error: "webfetch is a Pi extension; Vibe has no web_fetch tool from glove"
endpoints:
  # The harness reaches the egress proxy only through this forwarder; Pi
  # attaches it per request (never as a global dispatcher, so LLM traffic is
  # unaffected). Shell commands have no network either way.
  proxy:
    port: 8888
    target: { slot: egress }
harness:
  env:
    GLOVE_FETCH_PROXY: "{{ endpoint.proxy.url }}"
    # corporate egress only: its allowlist (private hosts the guard lets through)
    GLOVE_FETCH_ALLOW: "{{ (slot.egress.get('guard_hosts', []) + slot.egress.get('guard_cidrs', [])) | join(',') }}"
  pi: { extensions: [pi-extension] }   # Pi's web_fetch tool
  brief: brief.md
