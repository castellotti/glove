api: 1
name: corporate
summary: Egress to corporate resources only (over the host's corporate VPN) — a default-block netgate proxy with an allowlist; route corporate.
provides: [egress]
requires: [gate]
settings:
  allow_domains:  { type: list, default: [] }     # host globs; "*.corp.example" = its subdomains
  allow_cidrs:    { type: list, default: [] }     # e.g. ["10.20.0.0/16"]
  from_interface: { type: string, pattern: "[A-Za-z0-9._-]{1,32}" }  # add the host's routes via it (macOS)
  dns:            { type: string, default: host } # host | <IPv4 of a DNS server>
  tcp:            { type: list, default: [] }     # [{name: git-ssh, to: "git.example.internal:22"}]
  probe_url:      { type: string }                # an allowed URL `glove up` checks (optional)
hooks: hooks.py
exports:
  proxy_host: "glove-{{ session.id }}-corporate-proxy"
  proxy_port: 8888
  proxy_url: "http://glove-{{ session.id }}-corporate-proxy:8888"
  route: corporate
  resolver: none                                   # the gate resolves via `dns` itself
  network: egress
services: compose/services.yml.j2
verify:
  - { name: proxy-up, kind: tcp-open, host: "glove-{{ session.id }}-corporate-proxy", port: 8888,
      network: egress, retries: 10, interval: 2, service: corporate-proxy }
  # negative: the general internet is refused
  - { name: internet-refused, kind: http-refused, url: "https://example.com/",
      proxy: "http://glove-{{ session.id }}-corporate-proxy:8888", network: egress, retries: 5, interval: 2,
      service: corporate-proxy }
harness:
  brief: brief.md
