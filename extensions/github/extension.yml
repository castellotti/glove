api: 1
name: github
summary: gh, and git push/fetch/pull/clone, from shell commands — relayed to a sidecar that holds the tokens (github.com, GitHub Enterprise hosts); the sandbox never sees them or gets a route.
requires: [relay, egress]
settings:
  token: { type: secret }   # keychain:<service> | env:<VAR>: a github.com token (fine-grained, the repos you name)
  # GitHub Enterprise hosts, a token each: [{host: github.corp.example, token:
  # keychain:<service>}]. `token`, `hosts` or both; the relay serves only these.
  hosts: { type: list, default: [] }
  # gh subcommands relayed ("pr", "pr create", …); unset: the README's default
  # set. `auth`, `extension`, `alias`, `config`, `codespace`, `secret`,
  # `variable`, `ssh-key` and `gpg-key` are refused whatever this says.
  allow: { type: list, pattern: "^[a-z][a-z-]*( [a-z][a-z-]*)?$" }
  # git verbs relayed (`git pull` is a relayed fetch); drop `push` for a
  # read-only session
  git: { type: list, pattern: "^(push|fetch|clone|ls-remote)$", default: [push, fetch, clone, ls-remote] }
  timeout: { type: int, default: 600 }      # seconds one relayed command may run
networks:
  ghnet: { internal: true }                 # the relay sidecar (and, with observe, its gate)
hooks: hooks.py                             # the relay's settings; launch_env: the tokens, in memory; doctor
services: compose/services.yml.j2
endpoints:
  # The relay's hop to the egress proxy. Only rendered when a forwarder provider
  # (observe) interposes a gate: then the sidecar leaves the egress network and
  # reaches the proxy only through it, and every GitHub host it contacts is in
  # the flow record (client github). Otherwise it dials the proxy.
  github-egress:
    harness: false
    interpose: true
    target: { slot: egress }
    listen_networks: [ghnet]
    observe: { tool: gh }   # client: github (the default off a harness hop)
# /run/glove/github in the harness and the sidecar: where the gh/git shims leave
# requests (files and FIFOs; no socket, no network)
channels:
  github: { services: [gh] }
privileges:
  # `gh pr create`, `git push` and `git clone` work on the harness's checkout:
  # the sidecar binds the whole /work read-write (the policy defangs the
  # repo's config and keeps every file argument inside /work)
  gh: { work: true }
limits:
  gh: { pids: 256, memory: 1g }
# gh and git trust the session's corporate_ca too (relayd: ca_bundle_env)
trust_corporate_ca: [gh]
verify:
  - { name: github-relay-up, kind: container-healthy, service: gh }
harness:
  image:
    "*":
      copy: [[shim/gh, /usr/local/bin/gh], [shim/git, /usr/local/bin/git]]
  git_config:
    # Docker Desktop's file sharing shows a directory `git init`/`clone` just
    # made as root's (65534 under srt's user namespace), so git would call every
    # fresh checkout "dubious". All of /work is the agent's: there is no other
    # user's repository to guard against.
    safe.directory: "*"
  brief: brief.md
