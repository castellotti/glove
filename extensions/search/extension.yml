api: 1
name: search
summary: Web search through a per-session SearXNG behind the egress slot — Pi's web_search extension / an MCP server (Vibe, Claude Code).
requires: [egress]
settings:
  # Engine groups to remove (all on by default): engines that block Tor, need
  # a paid key, phone home at startup, or come from data-harvesting platforms.
  groups:  { type: map, default: { blocks_tor: true, requires_license: true, phones_home: true, security_mode: true } }
  engines: { type: map, default: {} }   # per-engine override: {"google": enable, "qwant": disable}
hooks: hooks.py
networks:
  searchnet: { internal: true }         # searxng ↔ valkey (↔ searxng-mcp), and the harness endpoints' forwarders
images:
  # harnesses that speak MCP get web_search from a sidecar over HTTP: one server for
  # each of them, nothing baked into the harness image
  mcp: { build: image, when: { renders: mcp } }
services: compose/services.yml.j2
endpoints:
  search:                               # Pi's extension queries SearXNG itself
    when: { harness: pi }
    port: 8080
    target: { service: searxng, network: searchnet, port: 8080 }
  search-mcp:
    when: { renders: mcp }
    port: 8000
    target: { service: searxng-mcp, network: searchnet, port: 8000 }
    observe: { tool: web_search }
  # SearXNG's hop to the egress proxy. Only rendered when a forwarder provider
  # (observe) interposes a gate: then SearXNG leaves the egress network and
  # reaches the proxy only through it. Otherwise SearXNG dials the proxy.
  searxng-egress:
    harness: false
    interpose: true
    target: { slot: egress }
    listen_networks: [searchnet]
    observe: { client: searxng }
verify:
  - { name: searxng-up, kind: http-ok, url: "http://glove-{{ session.id }}-searxng:8080/healthz",
      network: searchnet, retries: 20, interval: 3, service: searxng }
  - { name: search-mcp-up, kind: container-healthy, service: searxng-mcp, when: { renders: mcp } }
harness:
  env:
    SEARXNG_URL: { value: "{{ endpoint.search.url }}", when: { endpoint.search: { set: true } } }
  pi: { extensions: [pi-extension], tools: [web_search] }   # Pi has no MCP: its own extension
  mcp:                                  # rendered by harnesses that speak MCP
    - { name: searxng, transport: http, url: "{{ endpoint['search-mcp'].url }}/mcp", tools: web_search }
  brief: brief.md
