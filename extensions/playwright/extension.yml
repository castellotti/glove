api: 1
name: playwright
summary: A real Chromium for the agent via the Playwright MCP — a headless sidecar, a noVNC-watched sidecar, or the host's Chrome.
provides: [browser]
requires:
  - { slot: egress, when: { mode: [headless, novnc] } }
settings:
  mode:              { type: enum, values: [headless, novnc, host], default: headless }
  tools:             { type: list, pattern: "^browser_[a-z_]+$",
                       default: [browser_navigate, browser_navigate_back, browser_snapshot, browser_take_screenshot,
                                 browser_click, browser_type, browser_hover, browser_select_option,
                                 browser_press_key, browser_wait_for, browser_tabs, browser_handle_dialog] }
  # sidecar modes (headless, novnc)
  profile:           { type: enum, values: [ephemeral, session], default: ephemeral }
  viewport:          { type: string, pattern: "^[0-9]{3,4}x[0-9]{3,4}$", default: "1280x800" }
  timezone:          { type: string, pattern: "^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$", default: UTC }
  locale:            { type: string, pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$", default: en-US }
  chromium_sandbox:  { type: enum, values: ["on", "off"], default: "on" }
  downloads:         { type: enum, values: [session, work], default: session }
  uploads:           { type: enum, values: [none, work], default: none }
  resources:         { type: map, default: { memory: 2g, cpus: 2, pids: 2048 } }
  allow_persistent_profile_with_tor: { type: bool, default: false }
  ca:                { type: path }                     # a private CA's PEM the sidecar trusts too (no default)
  # novnc
  allow_control:     { type: bool, default: false }
  clipboard:         { type: enum, values: ["off", to-browser, both], default: "off" }
  # host
  port:              { type: int }                      # host MCP port (default: a free one per session)
  cdp_port:          { type: int }                      # host Chrome remote-debugging port (likewise)
  keep_browser:      { type: bool, default: false }     # leave the host Chrome running after `glove down`
  i_accept_host_rce: { type: bool, default: false }     # Vibe/Claude Code + host: see README
validate:
  - when: { mode: host, renders: mcp, i_accept_host_rce: false }
    error: >-
      mode: host with harness vibe or claude-code exposes Playwright's `browser_run_code_unsafe` on YOUR HOST: glove
      hides or denies it in the client, but that is a client-side filter, not a boundary. Use Pi, a sidecar
      mode, or set `i_accept_host_rce: true` to accept that risk.
  - when: { mode: host, slot.egress.anonymising: true }
    error: >-
      mode: host runs the browser on your desktop, so its traffic bypasses the session's vpn/tor egress;
      use mode: headless or novnc
  - when: { profile: session, slot.egress.provider: tor, allow_persistent_profile_with_tor: false }
    error: >-
      profile: session keeps cookies across launches, which links your Tor sessions together; use
      profile: ephemeral, or set allow_persistent_profile_with_tor: true to accept that
  - when: { mode: [headless, host], allow_control: true }
    error: "allow_control applies to mode: novnc only"
hooks: hooks.py
cli: cli.py
networks:
  browser-net: { internal: true }      # the sidecar and its two forwarders; nothing else
images:
  pw: { build: image, when: { mode: [headless, novnc] } }
services: compose/services.yml.j2
privileges:
  pw:
    - { seccomp: chromium-userns, when: { chromium_sandbox: "on" },
        hint: "set `playwright: {chromium_sandbox: \"off\"}` to run Chromium without its sandbox (the container stays the boundary)" }
limits:
  pw:
    pids: "{{ settings.resources.pids }}"
    memory: "{{ settings.resources.memory }}"
    cpus: "{{ settings.resources.cpus }}"
endpoints:
  # The harness's only way to the browser (host mode: the hook declares it,
  # pointing at the host MCP's port).
  browser:
    when: { mode: [headless, novnc] }
    port: 8931
    target: { service: pw, network: browser-net, port: 8931 }
    observe: { tool: browser }
  # The sidecar's only way out: the egress provider's proxy (with observe, a
  # gate labelling every destination `client: playwright`). Never on the
  # harness network.
  browser-egress:
    when: { mode: [headless, novnc] }
    harness: false
    target: { slot: egress }
    listen_networks: [browser-net]
    observe: { tool: browser }   # client: playwright (the default off a harness hop)
verify:
  - { name: browser-up, kind: container-healthy, service: pw, when: { mode: [headless, novnc] } }
harness:
  env:
    BROWSER_MCP_URL: "{{ endpoint.browser.url }}/mcp"
    BROWSER_MCP_TOOLS: "{{ settings.tools | join(',') }}"
    BROWSER_MODE: "{{ settings.mode }}"
  pi:                                  # Pi has no MCP: its own extension, registering the allowlist
    extensions: [pi-extension]         # (or browser_status when the browser is unreachable)
    tools: "browser_status,{{ settings.tools | join(',') }}"
  mcp:                                  # rendered by harnesses that speak MCP
    - name: playwright
      transport: http
      url: "{{ endpoint.browser.url }}/mcp"
      tools: "{{ settings.tools | join(',') }}"
      # every tool the pinned MCP defines (playwright-core 1.63.0, as in
      # image/package-lock.json; a unit test holds the two equal, and
      # playwright_live.py the list to the built image): a harness whose rules
      # can't express "only these" (Claude Code) denies the rest by name, so
      # approving one at a prompt is not possible either
      all_tools: >-
        browser_annotate,browser_check,browser_click,browser_close,browser_console_clear,browser_console_messages,
        browser_cookie_clear,browser_cookie_delete,browser_cookie_get,browser_cookie_list,browser_cookie_set,
        browser_drag,browser_drop,browser_evaluate,browser_file_upload,browser_fill_form,browser_find,
        browser_generate_locator,browser_get_config,browser_handle_dialog,browser_hide_highlight,browser_highlight,
        browser_hover,browser_keydown,browser_keyup,browser_localstorage_clear,browser_localstorage_delete,
        browser_localstorage_get,browser_localstorage_list,browser_localstorage_set,browser_mouse_click_xy,
        browser_mouse_down,browser_mouse_drag_xy,browser_mouse_move_xy,browser_mouse_up,browser_mouse_wheel,
        browser_navigate,browser_navigate_back,browser_navigate_forward,browser_network_clear,
        browser_network_request,browser_network_requests,browser_network_state_set,browser_pdf_save,
        browser_press_key,browser_press_sequentially,browser_reload,browser_resize,browser_resume,browser_route,
        browser_route_list,browser_run_code_unsafe,browser_select_option,browser_sessionstorage_clear,
        browser_sessionstorage_delete,browser_sessionstorage_get,browser_sessionstorage_list,
        browser_sessionstorage_set,browser_set_storage_state,browser_snapshot,browser_start_recording,
        browser_start_tracing,browser_start_video,browser_stop_recording,browser_stop_tracing,browser_stop_video,
        browser_storage_state,browser_tabs,browser_take_screenshot,browser_type,browser_uncheck,browser_unroute,
        browser_verify_element_visible,browser_verify_list_visible,browser_verify_text_visible,
        browser_verify_value,browser_video_chapter,browser_video_hide_actions,browser_video_show_actions,
        browser_wait_for
  brief: "brief/{{ settings.mode }}.md"
