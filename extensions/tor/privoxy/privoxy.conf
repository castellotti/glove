# `tor` resolves to the session's tor container only on its private torlink
# network (compose alias), so this file is the same for every session.
confdir /etc/privoxy
listen-address 0.0.0.0:8118
forward-socks5t / tor:9150 .
toggle 0
enable-remote-toggle 0
enable-remote-http-toggle 0
enable-edit-actions 0
accept-intercepted-requests 0
keep-alive-timeout 5
socket-timeout 300
