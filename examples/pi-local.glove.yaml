# glove session preset — Pi media-search crawl, parity with Vibe (DESIGN.md B).
# Import once into an environment bound to (cwd, pi), then launch:
#   cd ~/development/ai/pi-local
#   glove init pi --from <glove-repo>/examples/pi-local.glove.yaml
#   glove pi                      # launch
#   glove pi --dry-run            # preview
#
# Pi has no MCP client, so glove's baked `browser` extension bridges to a
# Playwright MCP (its own, on host :8932) → the SAME shared Chrome as Vibe.
harness: pi
provider: docker
# Same working tree as the Vibe run so Pi reads the identical plan + local refs
# and writes into the SAME leeroy_jenkins/research/ tree — but a separate
# collection subdir (below) keeps the two harnesses' outputs fully apart.
workdir: ../minimax-h3/input/leeroy_jenkins
# `name` is the env-id; glove sets it at `init` (derived from cwd, or --name).

model: qwen3.8-27b-5090
llm_service: llm
# Outputs go under research/pi/ (Vibe uses research/vibe/) so the collections are
# completely separate and directly comparable.
collection: pi

# Pi's config + your own extensions live at the env's own home,
# ~/.glove/envs/<env-id>/home/.pi/agent/ (persistent, per-instance,
# user-inspectable). glove writes only the files it owns (models.json,
# settings.json, AGENTS.md); your own extensions in .pi/agent/extensions/ are
# left untouched. No `config_home_source` needed — the env home is the default.

# The faustulus endpoint requires an API key. Replace with the real one; glove
# injects it as $GLOVE_LLM_API_KEY in the container and wires the provider to it.
llm_api_key: sk-REPLACE-ME

net: [service]
allow_root: false

services:
  # Shared faustulus model tunnel (same host :8899 as Vibe; port-deduped).
  - name: llm
    to: host.docker.internal:8899
    port: 8080
  # Shared private SearXNG.
  - name: search
    to: searxng:8080
    join_network: local-llm_ai-net
    port: 8080
  # Pi's OWN Playwright MCP on host :8932 (Vibe uses :8931), so the two can run
  # independently and screenshots land in the right collection dir.
  - name: browser
    to: host.docker.internal:8932
    port: 8932

host_services:
  # This preset drives a SYSTEM Google Chrome over CDP (option 2 in
  # docs/pi-remote-llm.md). If Chrome isn't installed, either install it or
  # switch to a dedicated Playwright Chrome-for-Testing via --executable-path —
  # see examples/pi-remote-llm.glove.yaml.
  # Shared with a Vibe run if one is up (glove reuses a live port).
  - name: model-tunnel
    command: "ssh -N -L 127.0.0.1:8899:127.0.0.1:8080 faustulus.local"
    ready_port: 8899
  - name: chrome
    command: '"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --remote-debugging-port=9222 --user-data-dir={chrome_profile} --no-first-run --no-default-browser-check'
    ready_port: 9222
    keep: true
  # Pi's Playwright MCP: distinct port 8932, attaches to the shared Chrome via
  # CDP, and writes screenshots into research/pi/media ({media_dir}).
  - name: playwright
    command: "npx @playwright/mcp@latest --host 127.0.0.1 --port 8932 --allowed-hosts glove-{session}-browser:8932 --cdp-endpoint http://127.0.0.1:9222 --shared-browser-context --output-dir {media_dir}"
    ready_port: 8932

brief: |
  This directory (/work) is the Leeroy-Jenkins job. Follow the plan in
  media-search-plan.md. TWO things are deliverables and BOTH matter: (1) the
  reference images/media under research/pi/media/, and (2) the written catalog
  research/pi/SEARCH-RESULTS.md. Write ONLY under research/pi/ — a separate Vibe
  run owns research/vibe/; do not touch it. Aim for 2-3 solid visual references
  per subject.

  YOU CAN SEE IMAGES — use it. Your browser_take_screenshot returns the image to
  your own vision AND saves it into research/pi/media/. You can also `read` any
  saved image file to look at it. Use this to judge what a page/image actually
  shows.

  IMAGE ECONOMY — CRITICAL. Every image you `read` becomes vision tokens that are
  re-sent each turn and share a fixed per-request budget; a few FULL-resolution
  frames (e.g. 1080p video stills at ~2000 vision-tokens each) exhaust it and the
  endpoint returns 413 "vision ... exceeds processor budget". Avoid this by
  downscaling BEFORE you read — never `read` a raw multi-megapixel still:
    - video frames: extract small — ffmpeg -ss T -i "$MP4" -frames:v 1
      -vf scale=768:-1 -q:v 4 /tmp/view.png   then: read /tmp/view.png
    - big stills:   convert SRC -resize 1024x1024\> /tmp/view.png   then read that
  Keep the FULL-resolution original in research/pi/media/ as the deliverable; only
  the /tmp view-copy you read needs to be small. Read about one image per turn,
  record what matters as TEXT in the catalog, and don't hoard full images in
  context. browser_take_screenshot images are already viewport-sized and safe to
  read directly.

  ANALYSIS TOOLS ARE INSTALLED — use them directly, do NOT probe for them:
  python3 with PIL (Pillow), ffmpeg/ffprobe, imagemagick (identify/convert),
  exiftool, cwebp/dwebp. Inspect the local Leeroy_Jenkins_WoW.webp with these.

  HOW YOUR ENVIRONMENT WORKS — not a normal setup:
  - Your shell/bash (/work) is a locked sandbox with NO internet and NO LAN.
    curl/wget/pip to external URLs WILL FAIL — do not try, it is not a bug.
  - Your browser_ tools drive a REAL Chromium on the operator's host (which has
    internet); that browser is how you reach the web. A human watches it.
  - To collect an image: navigate to its FULL-resolution src URL, then
    browser_take_screenshot with NO custom filename (custom names escape the
    save dir). The default-named PNG lands in research/pi/media/; `mv` it to the
    plan §4 name (rookery-env-01.png, whelp-01.png, …).

  RELEVANCE FILTERING (you have vision — do this as you go): look at each image
  you save. If it is NOT a useful visual reference for a live-action fantasy film
  — e.g. site chrome, ads, logos, review-site background tiles, UI, unrelated
  art — move it to research/pi/filtered/ (mkdir -p research/pi/filtered; then mv;
  never delete). Note in the catalog which were filtered and why. Keeping them in
  filtered/ (not deleted) lets us compare against the Vibe collection.

  SEARCH via web_search (SearXNG): shares one exit IP — do not hammer, never
  auto-retry on 429. CAPTCHA/login: stop and ask the operator.
